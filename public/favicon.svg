<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <!-- Background Pill / Rounded Squircle -->
  <rect width="64" height="64" rx="18" fill="url(#blueGrad)" />

  <!-- Inner Soft Radial Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Outer Eye Shape -->
  <path
    d="M8 32 C16 19, 48 19, 56 32 C48 45, 16 45, 8 32 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Iris -->
  <circle cx="32" cy="32" r="9.5" fill="url(#lensGrad)" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Pupil -->
  <circle cx="32" cy="32" r="4.5" fill="#0A1128" />

  <!-- Glossy Lens Specular Reflection Catchlight -->
  <circle cx="29.5" cy="29.5" r="2" fill="#FFFFFF" opacity="0.95" />
</svg>
